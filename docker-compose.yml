services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackhost
      POSTGRES_PASSWORD: hackhost
      POSTGRES_DB: hackhost
    ports:
      - "5432:5432"
    volumes:
      - hackhost_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackhost -d hackhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hackhost_pg:
